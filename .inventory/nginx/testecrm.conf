# Configuração Nginx para redirecionar /testesCRM para o servidor do painel
# Instalar Nginx no servidor 192.168.1.78 e adicionar este arquivo em conf.d/

server {
    listen 80;
    server_name 192.168.1.78;

    # Painel de Testes - CRM
    location /testesCRM {
        alias C:/crm-unimed/tests/playwright/backend/public;
        try_files $uri $uri/ /panel/index.html;
    }

    location /testesCRM/panel {
        alias C:/crm-unimed/tests/playwright/backend/public;
        try_files $uri $uri/ /panel/index.html;
    }

    # API
    location /testesCRM/api {
        proxy_pass http://127.0.0.1:3500/api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Swagger Docs
    location /testesCRM/api/docs {
        proxy_pass http://127.0.0.1:3500/api/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Socket.IO
    location /testesCRM/socket.io {
        proxy_pass http://127.0.0.1:3500/socket.io;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 86400;
        proxy_send_timeout 86400;
        proxy_read_timeout 86400;
    }
}